<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="720" viewBox="0 0 1140 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1140" height="720" fill="#FFFFFF"/>
  <text x="20" y="34" font-size="22" font-weight="bold" fill="#0F172A">sEMG Front-End Detail (reference)</text>
  <text x="20" y="56" font-size="11" fill="#64748B">Single channel (×8–16) — typical values, EE review required</text>

  <!-- Signal path -->
  <g font-size="13" font-weight="bold" fill="#0F172A">
    <rect x="20" y="110" width="120" height="140" rx="10" fill="#FFFFFF" stroke="#0866FF" stroke-width="2"/>
    <text x="32" y="136">E+ / E−</text>
    <text x="32" y="156" font-size="10" font-weight="normal" fill="#64748B">dry Au pads</text>
    <text x="32" y="172" font-size="10" font-weight="normal" fill="#64748B">6×3 mm</text>
    <text x="32" y="188" font-size="10" font-weight="normal" fill="#64748B">±5 mV max</text>
    <rect x="160" y="110" width="135" height="140" rx="10" fill="#FFFFFF" stroke="#0866FF" stroke-width="2"/>
    <text x="172" y="136">Protect</text>
    <text x="172" y="156" font-size="10" font-weight="normal" fill="#64748B">10 kΩ series</text>
    <text x="172" y="172" font-size="10" font-weight="normal" fill="#64748B">TVS → rails</text>
    <text x="172" y="188" font-size="10" font-weight="normal" fill="#64748B">1 µF AC couple</text>
    <rect x="315" y="110" width="135" height="140" rx="10" fill="#F3F6FA" stroke="#0866FF" stroke-width="2"/>
    <text x="327" y="136">Diff PGA</text>
    <text x="327" y="156" font-size="10" font-weight="normal" fill="#64748B">G = 12</text>
    <text x="327" y="172" font-size="10" font-weight="normal" fill="#64748B">CMRR &gt;100 dB</text>
    <text x="327" y="188" font-size="10" font-weight="normal" fill="#64748B">Zin &gt;100 MΩ</text>
    <rect x="470" y="110" width="135" height="140" rx="10" fill="#FFFFFF" stroke="#0866FF" stroke-width="2"/>
    <text x="482" y="136">Filter</text>
    <text x="482" y="156" font-size="10" font-weight="normal" fill="#64748B">HPF 5 Hz</text>
    <text x="482" y="172" font-size="10" font-weight="normal" fill="#64748B">LPF 250 Hz</text>
    <text x="482" y="188" font-size="10" font-weight="normal" fill="#64748B">50/60 notch</text>
    <rect x="625" y="110" width="125" height="140" rx="10" fill="#FFFFFF" stroke="#0866FF" stroke-width="2"/>
    <text x="637" y="136">ADC Drv</text>
    <text x="637" y="156" font-size="10" font-weight="normal" fill="#64748B">buffer</text>
    <text x="637" y="172" font-size="10" font-weight="normal" fill="#64748B">anti-alias</text>
    <rect x="770" y="110" width="125" height="140" rx="10" fill="#F3F6FA" stroke="#0866FF" stroke-width="2"/>
    <text x="782" y="136">ADC</text>
    <text x="782" y="156" font-size="10" font-weight="normal" fill="#64748B">24-bit ΣΔ</text>
    <text x="782" y="172" font-size="10" font-weight="normal" fill="#64748B">2 kSPS/ch</text>
    <rect x="915" y="110" width="135" height="140" rx="10" fill="#E7F0FF" stroke="#7B61FF" stroke-width="2.5"/>
    <text x="927" y="136">Digital</text>
    <text x="927" y="156" font-size="10" font-weight="normal" fill="#64748B">imp gate</text>
    <text x="927" y="172" font-size="10" font-weight="normal" fill="#64748B">RMS 125 ms</text>
    <text x="927" y="188" font-size="10" font-weight="normal" fill="#64748B">SPI → hub</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="140" y1="180" x2="158" y2="180" marker-end="url(#ah)"/>
    <line x1="295" y1="180" x2="313" y2="180" marker-end="url(#ah)"/>
    <line x1="450" y1="180" x2="468" y2="180" marker-end="url(#ah)"/>
    <line x1="605" y1="180" x2="623" y2="180" marker-end="url(#ah)"/>
    <line x1="750" y1="180" x2="768" y2="180" marker-end="url(#ah)"/>
    <line x1="895" y1="180" x2="913" y2="180" marker-end="url(#ah)"/>
  </g>

  <!-- DRL + impedance -->
  <g font-size="13" font-weight="bold" fill="#0F172A">
    <rect x="315" y="290" width="135" height="100" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
    <text x="327" y="316">DRL Amp</text>
    <text x="327" y="336" font-size="10" font-weight="normal" fill="#64748B">drives REF</text>
    <text x="327" y="352" font-size="10" font-weight="normal" fill="#64748B">CM cancel</text>
    <rect x="470" y="290" width="135" height="100" rx="10" fill="#FFFFFF" stroke="#0866FF" stroke-width="2"/>
    <text x="482" y="316">Z-Inject</text>
    <text x="482" y="336" font-size="10" font-weight="normal" fill="#64748B">10 nA AC</text>
    <text x="482" y="352" font-size="10" font-weight="normal" fill="#64748B">1 kHz / ch</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="382" y1="290" x2="382" y2="252" marker-end="url(#ah)"/>
    <line x1="315" y1="340" x2="80" y2="340"/>
    <line x1="80" y1="340" x2="80" y2="252" marker-end="url(#ah)"/>
  </g>
  <g stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="5,4">
    <line x1="537" y1="290" x2="537" y2="252" marker-end="url(#ah)"/>
  </g>
  <text x="150" y="332" font-size="10" fill="#64748B">driven REF</text>
  <text x="543" y="274" font-size="10" fill="#64748B">Z sense</text>

  <!-- Array map -->
  <text x="20" y="430" font-size="16" font-weight="bold" fill="#0F172A">Array map (wrist cross-section, looking down the arm)</text>
  <ellipse cx="300" cy="552" rx="120" ry="70" fill="#F3F6FA" stroke="#334155" stroke-width="2"/>
  <ellipse cx="300" cy="552" rx="92" ry="50" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="300" y="556" font-size="11" fill="#64748B" text-anchor="middle">wrist</text>
  <g font-size="9" font-weight="bold" fill="#0F172A" text-anchor="middle">
    <rect x="400" y="528" width="40" height="24" rx="6" fill="#FFFFFF" stroke="#0866FF" stroke-width="1.5"/>
    <text x="420" y="544">CH0±</text>
    <rect x="365" y="578" width="40" height="24" rx="6" fill="#FFFFFF" stroke="#0866FF" stroke-width="1.5"/>
    <text x="385" y="594">CH1±</text>
    <rect x="280" y="598" width="40" height="24" rx="6" fill="#FFFFFF" stroke="#0866FF" stroke-width="1.5"/>
    <text x="300" y="614">CH2±</text>
    <rect x="195" y="578" width="40" height="24" rx="6" fill="#FFFFFF" stroke="#0866FF" stroke-width="1.5"/>
    <text x="215" y="594">CH3±</text>
    <rect x="160" y="528" width="40" height="24" rx="6" fill="#FFFFFF" stroke="#0866FF" stroke-width="1.5"/>
    <text x="180" y="544">CH4±</text>
    <rect x="195" y="478" width="40" height="24" rx="6" fill="#FFFFFF" stroke="#0866FF" stroke-width="1.5"/>
    <text x="215" y="494">CH5±</text>
    <rect x="280" y="458" width="40" height="24" rx="6" fill="#FFFFFF" stroke="#0866FF" stroke-width="1.5"/>
    <text x="300" y="474">CH6±</text>
    <rect x="365" y="478" width="40" height="24" rx="6" fill="#FFFFFF" stroke="#0866FF" stroke-width="1.5"/>
    <text x="385" y="494">CH7±</text>
  </g>
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="442" y1="540" x2="470" y2="540"/>
    <line x1="401" y1="606" x2="420" y2="625"/>
    <line x1="300" y1="624" x2="300" y2="652"/>
    <line x1="199" y1="606" x2="180" y2="625"/>
    <line x1="158" y1="540" x2="130" y2="540"/>
    <line x1="199" y1="474" x2="180" y2="455"/>
    <line x1="300" y1="456" x2="300" y2="440"/>
    <line x1="401" y1="474" x2="420" y2="455"/>
  </g>
  <circle cx="150" cy="500" r="9" fill="#00B2FF" stroke="#0F172A" stroke-width="1"/>
  <text x="150" y="524" font-size="10" fill="#0F172A" text-anchor="middle">REF</text>

  <g font-size="13" font-weight="bold" fill="#0F172A">
    <rect x="520" y="480" width="190" height="130" rx="10" fill="#F3F6FA" stroke="#0866FF" stroke-width="2"/>
    <text x="534" y="508">AFE 8ch</text>
    <text x="534" y="530" font-size="11" font-weight="normal" fill="#64748B">CH0–7 diff in</text>
    <text x="534" y="550" font-size="11" font-weight="normal" fill="#64748B">SPI + DRDY out</text>
    <text x="534" y="570" font-size="11" font-weight="normal" fill="#64748B">DVDD 1.8V</text>
  </g>
  <line x1="440" y1="552" x2="518" y2="552" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
  <text x="445" y="544" font-size="10" fill="#64748B">shielded flex</text>

  <g font-size="13" font-weight="bold" fill="#0F172A">
    <rect x="740" y="455" width="360" height="180" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
    <text x="754" y="483">Routing rules</text>
    <text x="754" y="507" font-size="11" font-weight="normal" fill="#0F172A">· Diff pairs length-matched ±2 mm</text>
    <text x="754" y="529" font-size="11" font-weight="normal" fill="#0F172A">· Guard traces at DRL potential</text>
    <text x="754" y="551" font-size="11" font-weight="normal" fill="#0F172A">· Analog island, single-point GND</text>
    <text x="754" y="573" font-size="11" font-weight="normal" fill="#0F172A">· No digital routing under AFE</text>
    <text x="754" y="595" font-size="11" font-weight="normal" fill="#0F172A">· Shielded flex, 360° drain at AFE</text>
  </g>

  <text x="20" y="700" font-size="11" fill="#64748B">Reference schematic — illustrative values. Requires EE review + bench validation before layout.</text>
</svg>
