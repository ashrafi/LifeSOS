<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="300" fill="#FFFFFF"/>
  <text x="20" y="36" font-size="22" font-weight="bold" fill="#0F172A">sEMG Signal Chain (per channel, ×8–16)</text>

  <g font-size="13" font-weight="bold" fill="#0F172A">
    <rect x="8" y="88" width="110" height="104" rx="10" fill="#FFFFFF" stroke="#0866FF" stroke-width="2"/>
    <text x="18" y="116">Electrodes</text>
    <text x="18" y="136" font-size="10" font-weight="normal" fill="#64748B">dry Au pads</text>
    <text x="18" y="152" font-size="10" font-weight="normal" fill="#64748B">sprung contacts</text>
    <rect x="148" y="88" width="110" height="104" rx="10" fill="#FFFFFF" stroke="#0866FF" stroke-width="2"/>
    <text x="158" y="116">ESD + Diff</text>
    <text x="158" y="136" font-size="10" font-weight="normal" fill="#64748B">PGA · CMRR</text>
    <text x="158" y="152" font-size="10" font-weight="normal" fill="#64748B">&gt;100 dB</text>
    <rect x="288" y="88" width="110" height="104" rx="10" fill="#FFFFFF" stroke="#0866FF" stroke-width="2"/>
    <text x="298" y="116">BPF+Notch</text>
    <text x="298" y="136" font-size="10" font-weight="normal" fill="#64748B">5–250 Hz</text>
    <text x="298" y="152" font-size="10" font-weight="normal" fill="#64748B">50/60 cut</text>
    <rect x="428" y="88" width="110" height="104" rx="10" fill="#F3F6FA" stroke="#0866FF" stroke-width="2"/>
    <text x="438" y="116">ADC</text>
    <text x="438" y="136" font-size="10" font-weight="normal" fill="#64748B">16–24 bit</text>
    <text x="438" y="152" font-size="10" font-weight="normal" fill="#64748B">1–2 kHz</text>
    <rect x="568" y="88" width="110" height="104" rx="10" fill="#F3F6FA" stroke="#0866FF" stroke-width="2"/>
    <text x="578" y="116">Imp Gate</text>
    <text x="578" y="136" font-size="10" font-weight="normal" fill="#64748B">+ RMS 125ms</text>
    <text x="578" y="152" font-size="10" font-weight="normal" fill="#64748B">drop bad ch</text>
    <rect x="708" y="88" width="110" height="104" rx="10" fill="#E7F0FF" stroke="#7B61FF" stroke-width="2.5"/>
    <text x="718" y="116">NPU CNN</text>
    <text x="718" y="136" font-size="10" font-weight="normal" fill="#64748B">gesture</text>
    <text x="718" y="152" font-size="10" font-weight="normal" fill="#64748B">+ tension</text>
    <rect x="848" y="88" width="110" height="104" rx="10" fill="#FFFFFF" stroke="#00B2FF" stroke-width="2"/>
    <text x="858" y="116">Tokens</text>
    <text x="858" y="136" font-size="10" font-weight="normal" fill="#64748B">to Life</text>
    <text x="858" y="152" font-size="10" font-weight="normal" fill="#64748B">Engine</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="120" y1="140" x2="146" y2="140" marker-end="url(#ah)"/>
    <line x1="260" y1="140" x2="286" y2="140" marker-end="url(#ah)"/>
    <line x1="400" y1="140" x2="426" y2="140" marker-end="url(#ah)"/>
    <line x1="540" y1="140" x2="566" y2="140" marker-end="url(#ah)"/>
    <line x1="680" y1="140" x2="706" y2="140" marker-end="url(#ah)"/>
    <line x1="820" y1="140" x2="846" y2="140" marker-end="url(#ah)"/>
  </g>
  <g font-size="9" fill="#64748B" text-anchor="middle">
    <text x="133" y="130">µV</text>
    <text x="273" y="130">×gain</text>
    <text x="413" y="130">clean</text>
    <text x="553" y="130">bits</text>
    <text x="693" y="130">env</text>
    <text x="833" y="130">class</text>
  </g>

  <text x="20" y="270" font-size="11" fill="#64748B">Raw waveforms never leave this chain — only RMS envelopes and classified tokens go downstream.</text>
</svg>
